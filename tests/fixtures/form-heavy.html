<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Form Heavy Fixture</title>
</head>
<body>
  <h1>Registration</h1>
  <form id="reg">
    <label>Full name <input name="name" autocomplete="name" /></label>
    <label>Email <input name="email" type="email" autocomplete="email" value="ayush@example.com" /></label>
    <label>Phone <input name="phone" type="tel" autocomplete="tel" value="9876543210" /></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" value="secret" /></label>
    <label>Card <input name="card" autocomplete="cc-number" value="4111111111111111" /></label>
    <button type="submit">Create account</button>
  </form>
</body>
</html>
